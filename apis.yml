aid: radixark
name: RadixArk
description: >-
  RadixArk is a deep-tech AI-infrastructure company on a mission to make
  frontier-level AI infrastructure open and accessible to everyone ("Build AI
  for all"). Backed by a $100M seed round announced in May 2026, RadixArk builds
  open-source infrastructure and managed tooling for training and serving modern
  AI models at scale. Its flagship open-source projects are SGLang, a fast and
  flexible inference/serving engine for large language and vision-language
  models, and Miles, an enterprise-facing reinforcement-learning framework for
  LLM and VLM post-training (with a companion Miles Diffusion framework for
  large-scale diffusion training). RadixArk also operates a managed platform at
  platform.radixark.com serving developers, enterprises, and research labs. The
  company does not yet expose a public REST/HTTP API; this profile captures its
  open-source packages, identity, and security posture pending an API surface.
